name: Run practical and publish output images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tests-and-outputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Generate model results and charts
        run: python main.py | tee results/console_output.txt
      - name: Commit generated charts and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/ results/
          if ! git diff --cached --quiet; then
            git commit -m "Add verified experiment outputs and graphs"
            git push
          fi
